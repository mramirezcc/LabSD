<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora SOAP | Lab 07 — Sistemas Distribuidos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f8f9fa;
      color: #1a1a2e;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1.5rem 4rem;
    }

    header {
      width: 100%;
      max-width: 860px;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .header-left h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -.02em;
    }
    .header-left h1 span { color: #2563eb; }
    .header-left p {
      font-size: .82rem;
      color: #6b7280;
      margin-top: .2rem;
      font-weight: 400;
    }
    .header-badge {
      display: flex;
      align-items: center;
      gap: .4rem;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 999px;
      padding: .35rem .9rem;
      font-size: .75rem;
      color: #374151;
      font-weight: 500;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #d1d5db;
      flex-shrink: 0;
      transition: background .3s;
    }
    .status-dot.online  { background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.2); }
    .status-dot.offline { background: #ef4444; }

    .main-card {
      width: 100%;
      max-width: 860px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media(max-width: 580px) { .grid { grid-template-columns: 1fr; } }

    .section-title {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: .85rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-bottom: 1.2rem;
    }
    .input-label {
      font-size: .8rem;
      font-weight: 500;
      color: #374151;
    }
    .input-field {
      width: 100%;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      color: #1a1a2e;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      padding: .65rem 1rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .input-field:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
      background: #fff;
    }
    .input-field::-webkit-inner-spin-button { opacity: .3; }

    .ops-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .5rem;
      margin-bottom: 1.4rem;
    }
    .btn-op {
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      color: #374151;
      font-family: 'JetBrains Mono', monospace;
      font-size: .9rem;
      font-weight: 500;
      padding: .6rem .5rem;
      cursor: pointer;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
    }
    .btn-op:hover {
      border-color: #93c5fd;
      background: #eff6ff;
      color: #1d4ed8;
    }
    .btn-op.active {
      border-color: #2563eb;
      background: #eff6ff;
      color: #1d4ed8;
      box-shadow: 0 0 0 3px rgba(37,99,235,.1);
    }
    .btn-op .sym { font-size: 1.15rem; }

    .btn-exec {
      width: 100%;
      padding: .75rem;
      background: #2563eb;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .02em;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-exec:hover  { background: #1d4ed8; }
    .btn-exec:active { transform: scale(.98); }
    .btn-exec:disabled { background: #93c5fd; cursor: not-allowed; }

    .result-box {
      background: #f0f9ff;
      border: 1.5px solid #bae6fd;
      border-radius: 10px;
      padding: 1rem 1.2rem;
      margin-top: 1rem;
    }
    .result-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #0369a1;
      margin-bottom: .3rem;
    }
    .result-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.4rem;
      font-weight: 500;
      color: #1d4ed8;
      min-height: 2.8rem;
      line-height: 1;
      padding-top: .2rem;
    }
    .result-value.error   { color: #dc2626; font-size: 1rem; line-height: 1.5; padding-top: .4rem; }
    .result-value.loading { color: #93c5fd; font-size: 1rem; padding-top: .4rem; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    .divider {
      width: 1px;
      background: #f0f0f0;
      margin: 0 .5rem;
    }
    @media(max-width:580px){ .divider { display:none; } }

    .envelope-wrap {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      overflow-x: auto;
      max-height: 260px;
      overflow-y: auto;
    }
    pre {
      font-family: 'JetBrains Mono', monospace;
      font-size: .73rem;
      line-height: 1.75;
      color: #374151;
      white-space: pre;
    }
    .xt  { color: #1d4ed8; }
    .xa  { color: #0891b2; }
    .xv  { color: #b45309; }
    .xn  { color: #22c55e; font-weight: 500; }

    .cors-section {
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid #f0f0f0;
    }
    .cors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .cors-card {
      background: #fafafa;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .cors-card-num {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #9ca3af;
      margin-bottom: .45rem;
    }
    .cors-card-title {
      font-size: .88rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: .4rem;
    }
    .cors-card-body {
      font-size: .8rem;
      color: #4b5563;
      line-height: 1.65;
    }
    .cors-card-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: .75rem;
      background: #f0f0f0;
      padding: .1rem .35rem;
      border-radius: 4px;
      color: #1a1a2e;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Calculadora <span>SOAP</span></h1>
    <p>Sistemas Distribuidos · UNSA 2026A · Grupo B</p>
  </div>
  <div class="header-badge">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Verificando proxy...</span>
  </div>
</header>

<div class="main-card">
  <div class="grid">

    <!-- Izquierda: inputs -->
    <div>
      <p class="section-title">Parámetros</p>

      <div class="input-group">
        <label class="input-label">Valor A</label>
        <input type="number" id="numA" class="input-field" value="5" />
      </div>
      <div class="input-group">
        <label class="input-label">Valor B</label>
        <input type="number" id="numB" class="input-field" value="8" />
      </div>

      <p class="section-title" style="margin-top:.4rem">Operación</p>
      <div class="ops-grid">
        <button class="btn-op active" data-op="Add"      onclick="selOp(this)"><span class="sym">+</span> Add</button>
        <button class="btn-op"        data-op="Subtract" onclick="selOp(this)"><span class="sym">−</span> Subtract</button>
        <button class="btn-op"        data-op="Multiply" onclick="selOp(this)"><span class="sym">×</span> Multiply</button>
        <button class="btn-op"        data-op="Divide"   onclick="selOp(this)"><span class="sym">÷</span> Divide</button>
      </div>

      <button class="btn-exec" id="btnExec" onclick="ejecutarSOAP()">
        Enviar petición SOAP
      </button>

      <div class="result-box">
        <div class="result-label">Resultado</div>
        <div class="result-value" id="resultado">—</div>
      </div>
    </div>

    <!-- Derecha: envelope -->
    <div>
      <p class="section-title">SOAP Envelope generado</p>
      <div class="envelope-wrap">
        <pre id="envelopeView"><span style="color:#9ca3af">// Escribe los valores para ver el envelope</span></pre>
      </div>
    </div>

  </div>

</div>

<script>
  const PROXY   = 'http://localhost:5000';
  let opActual  = 'Add';

  function selOp(btn) {
    document.querySelectorAll('.btn-op').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    opActual = btn.dataset.op;
    actualizarEnvelope();
  }

  function generarEnvelope(op, a, b) {
    return `<?xml version="1.0" encoding="utf-8"?>\n<soap:Envelope\n  xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">\n  <soap:Body>\n    <${op} xmlns="http://tempuri.org/">\n      <intA>${a}</intA>\n      <intB>${b}</intB>\n    </${op}>\n  </soap:Body>\n</soap:Envelope>`;
  }

  function colorXML(xml) {
    return xml
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/(&lt;\/?)([\w:]+)/g, '<span class="xt">$1$2</span>')
      .replace(/(xmlns[:\w]*)=/g,    '<span class="xa">$1</span>=')
      .replace(/="([^"]*)"/g,        '="<span class="xv">$1</span>"')
      .replace(/(&gt;)(\d+)(&lt;)/g, '$1<span class="xn">$2</span>$3');
  }

  function actualizarEnvelope() {
    const a = document.getElementById('numA').value || '0';
    const b = document.getElementById('numB').value || '0';
    document.getElementById('envelopeView').innerHTML =
      colorXML(generarEnvelope(opActual, a, b));
  }

  async function checkProxy() {
    const dot  = document.getElementById('statusDot');
    const txt  = document.getElementById('statusText');
    try {
      const r = await fetch(`${PROXY}/status`, {signal: AbortSignal.timeout(2000)});
      if (r.ok) {
        dot.className = 'status-dot online';
        txt.textContent = 'Proxy activo';
      } else {
        dot.className = 'status-dot offline';
        txt.textContent = 'Proxy con error';
      }
    } catch {
      dot.className = 'status-dot offline';
      txt.textContent = 'Proxy offline';
    }
  }

  async function ejecutarSOAP() {
    const a   = parseFloat(document.getElementById('numA').value) || 0;
    const b   = parseFloat(document.getElementById('numB').value) || 0;
    const btn = document.getElementById('btnExec');
    const res = document.getElementById('resultado');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');

    actualizarEnvelope();
    btn.disabled    = true;
    res.className   = 'result-value loading';
    res.textContent = 'enviando...';

    try {
      const response = await fetch(`${PROXY}/soap`, {
        method : 'POST',
        headers: {'Content-Type': 'application/json'},
        body   : JSON.stringify({operation: opActual, a, b}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);

      res.className   = 'result-value';
      res.textContent = data.result;
      dot.className   = 'status-dot online';
      txt.textContent = 'Proxy activo';

    } catch (err) {
      res.className = 'result-value error';
      const noProxy = err.message.includes('Failed to fetch') || err.name === 'TypeError';
      if (noProxy) {
        res.textContent = 'Proxy offline — ejecuta proxy_soap.py';
        dot.className   = 'status-dot offline';
        txt.textContent = 'Proxy offline';
      } else {
        res.textContent = `Error: ${err.message}`;
        dot.className   = 'status-dot offline';
        txt.textContent = 'Error';
      }
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById('numA').addEventListener('input', actualizarEnvelope);
  document.getElementById('numB').addEventListener('input', actualizarEnvelope);

  actualizarEnvelope();
  checkProxy();
</script>
</body>
</html>
